{% extends "base.html" %}

{% block title %}Add Building - PG Vacancy Manager{% endblock %}

{% block content %}

<h2>Add Building</h2>

<p>Add a PG building to your system.</p>

<div class="card">

    {% if error %}
        <p style="color: #dc2626;">{{ error }}</p>
    {% endif %}

    <form method="POST">

        <div class="form-group">
            <label for="name">Building Name</label>

            <input
                type="text"
                id="name"
                name="name"
                placeholder="Example: Sri Sai PG"
                required
            >
        </div>

        <div class="form-group">
            <label for="address">Address</label>

            <input
                type="text"
                id="address"
                name="address"
                placeholder="Optional"
            >
        </div>

        <div class="page-actions">

            <button type="submit" class="btn btn-primary">
                Save Building
            </button>

            <a
                href="{{ url_for('buildings.buildings') }}"
                class="btn btn-secondary"
            >
                Cancel
            </a>

        </div>

    </form>

</div>

{% endblock %}
