{% extends "base.html" %}

{% block title %}Edit Room - PG Vacancy Manager{% endblock %}

{% block content %}

<h2>Edit Room</h2>

<p>
    Update Room {{ room.room_number }}
    in <strong>{{ building.name }}</strong>.
</p>

<div class="card">

    {% if error %}

        <p style="color: #dc2626; font-weight: bold;">
            {{ error }}
        </p>

    {% endif %}

    <form method="POST">

        <div class="form-group">

            <label for="room_number">
                Room Number
            </label>

            <input
                type="text"
                id="room_number"
                name="room_number"
                value="{{ room.room_number }}"
                required
            >

        </div>


        <div class="form-group">

            <label for="sharing_type">
                Sharing Type
            </label>

            <select
                id="sharing_type"
                name="sharing_type"
                required
            >

                <option
                    value="1"
                    {% if room.sharing_type == 1 %}selected{% endif %}
                >
                    Single Sharing
                </option>

                <option
                    value="2"
                    {% if room.sharing_type == 2 %}selected{% endif %}
                >
                    2 Sharing
                </option>

                <option
                    value="3"
                    {% if room.sharing_type == 3 %}selected{% endif %}
                >
                    3 Sharing
                </option>

                <option
                    value="4"
                    {% if room.sharing_type == 4 %}selected{% endif %}
                >
                    4 Sharing
                </option>

            </select>

        </div>


        <div class="page-actions">

            <button
                type="submit"
                class="btn btn-primary"
            >
                Save Changes
            </button>

            <a
                href="{{ url_for(
                    'buildings.building_detail',
                    building_id=building.id
                ) }}"
                class="btn btn-secondary"
            >
                Cancel
            </a>

        </div>

    </form>

</div>

{% endblock %}
